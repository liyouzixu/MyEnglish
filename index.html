<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ogden 850 · 基础英语词卡</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
  :root{
    --paper:#EEE8DA;
    --paper-2:#E5DECC;
    --card:#FCF9F0;
    --card-deck:#E3DCC8;
    --ink:#272219;
    --ink-soft:#7A7161;
    --line:#D8CFB9;
    --pending:#4A5D6E;
    --known:#3F684E;
    --star:#B2761E;
    --accent:#345B8C;
    --accent-ink:#FFFFFF;
    --shadow:0 18px 40px -18px rgba(60,50,30,.35), 0 3px 10px -4px rgba(60,50,30,.18);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #F5F0E4 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(120,105,80,.022) 3px 4px),
      var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100%;
    display:flex;flex-direction:column;
  }
  .wrap{max-width:600px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;padding:0 16px}

  /* ===== 顶栏 ===== */
  header{
    padding:18px 0 10px;
    display:flex;align-items:center;gap:10px;
  }
  .brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
  .brand h1{
    font-family:"Source Serif 4","Noto Serif SC",Georgia,"Songti SC",serif;
    font-size:17px;font-weight:700;letter-spacing:.2px;white-space:nowrap;
  }
  .brand .sub{font-size:11px;color:var(--ink-soft);letter-spacing:.4px;margin-top:2px}
  .head-actions{margin-left:auto;display:flex;gap:8px}
  .icon-btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    width:38px;height:38px;border-radius:11px;display:grid;place-items:center;cursor:pointer;
    transition:transform .12s ease, background .15s ease;box-shadow:0 1px 2px rgba(60,50,30,.08);
  }
  .icon-btn:hover{background:#FFFDF6}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn svg{width:19px;height:19px}
  .icon-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .icon-btn.on:hover{background:#2E5079}
  .icon-btn.on svg{fill:currentColor}

  /* ===== 进度 ===== */
  .stats{
    display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink-soft);
    padding:4px 2px 10px;
  }
  .stat{display:inline-flex;align-items:center;gap:5px}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .dot.pending{background:var(--pending)}
  .dot.known{background:var(--known)}
  .dot.star{background:var(--star)}
  .stat b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;width:0%;border-radius:99px;background:var(--pending);transition:width .35s ease}

  /* ===== 卡片区 ===== */
  .stage{
    position:relative;flex:1;display:flex;align-items:center;justify-content:center;
    padding:6px 0 16px;min-height:340px;
  }
  .deck{position:relative;width:100%;max-width:480px;padding:0 6px}
  .deck::before,.deck::after{
    content:"";position:absolute;left:50%;transform:translateX(-50%);border-radius:var(--radius);
    background:var(--card-deck);border:1px solid var(--line);
  }
  .deck::before{width:98%;height:100%;top:9px;z-index:0}
  .deck::after{width:99.3%;height:100%;top:4px;z-index:1}
  .card{
    position:relative;z-index:2;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:34px 26px 30px;min-height:340px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  }
  /* 状态索引标签：像旧式目录卡的色条 */
  .tab{
    position:absolute;top:-1px;right:22px;height:26px;min-width:74px;padding:0 12px;
    border-radius:0 0 9px 9px;background:var(--pending);color:#fff;font-size:11px;
    letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:5px;
    box-shadow:0 2px 5px -2px rgba(0,0,0,.25);transition:background .2s ease;
  }
  .tab svg{width:11px;height:11px}
  .card.known .tab{background:var(--known)}
  .card.star .tab{background:var(--star)}
  .card.hidden .tab{opacity:0}

  .speaker{
    position:absolute;top:16px;left:16px;width:34px;height:34px;border:none;background:transparent;
    color:var(--ink-soft);cursor:pointer;border-radius:9px;display:grid;place-items:center;
  }
  .speaker:hover{background:rgba(120,105,80,.1);color:var(--ink)}
  .speaker svg{width:18px;height:18px}

  .word{
    font-family:"Source Serif 4","Noto Serif SC",Georgia,"Songti SC",serif;
    font-size:clamp(38px, 12vw, 60px);font-weight:700;line-height:1.06;letter-spacing:.2px;
    word-break:break-word;margin-top:14px;
  }
  .phonetic{
    font-size:16px;color:var(--ink-soft);margin-top:12px;letter-spacing:.4px;
    font-family:"Noto Sans SC",system-ui,sans-serif;
  }
  .reveal{border-top:1px dashed var(--line);margin-top:26px;padding-top:20px;width:100%}
  .def{
    font-size:20px;font-weight:500;line-height:1.5;color:var(--ink);
  }
  .ex{
    font-size:15px;line-height:1.75;color:var(--ink-soft);margin-top:12px;font-style:italic;
    font-family:Georgia,"Noto Serif SC",serif;text-wrap:pretty;
  }
  .hint-reveal{font-size:12px;color:var(--ink-soft);margin-top:24px;letter-spacing:.3px}
  .hint-reveal kbd{
    font-family:inherit;font-size:11px;background:#F0EADA;border:1px solid var(--line);
    border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink);
  }

  /* 完成面板 */
  .done{display:none;z-index:2;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:40px 28px;text-align:center;max-width:480px;width:100%}
  .done h2{font-family:"Source Serif 4","Noto Serif SC",Georgia,serif;font-size:26px;font-weight:700}
  .done p{color:var(--ink-soft);font-size:14px;margin-top:8px;line-height:1.7}
  .done .d-stats{display:flex;justify-content:center;gap:20px;margin:24px 0 8px}
  .done .d-stats .stat{flex-direction:column;gap:2px;font-size:12px}
  .done .d-stats b{font-size:26px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .done .d-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .done button{width:100%}

  /* ===== 操作栏 ===== */
  .controls{
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:8px 0 18px;
  }
  .ctrl{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:14px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:5px;cursor:pointer;font-size:12px;font-weight:500;transition:transform .1s ease, background .15s ease, box-shadow .15s ease;
    box-shadow:0 1px 2px rgba(60,50,30,.08);font-family:inherit;
  }
  .ctrl svg{width:20px;height:20px}
  .ctrl .key{
    font-size:10px;color:var(--ink-soft);background:#F0EADA;border:1px solid var(--line);
    border-radius:4px;padding:0 4px;line-height:1.5;
  }
  .ctrl:active{transform:scale(.96)}
  .ctrl:disabled{opacity:.35;cursor:not-allowed}
  .ctrl.prev,.ctrl.next{color:var(--ink)}
  .ctrl.known-btn{border-color:#BFD3C5;color:var(--known)}
  .ctrl.known-btn:disabled{border-color:var(--line);color:var(--ink-soft)}
  .ctrl.reveal-btn{border-color:#B9CBDE;color:var(--accent)}
  .ctrl.star-btn{border-color:#E0C69B;color:var(--star)}
  .ctrl.star-btn:disabled{border-color:var(--line);color:var(--ink-soft)}
  .ctrl:disabled svg{opacity:.5}

  /* ===== 词表弹层 ===== */
  .mask{position:fixed;inset:0;background:rgba(40,32,20,.42);z-index:20;display:none;align-items:flex-end;justify-content:center}
  .mask.open{display:flex}
  .sheet{
    background:var(--paper);width:100%;max-width:600px;border-radius:20px 20px 0 0;
    max-height:82vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.2);
  }
  .sheet-head{padding:16px 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .sheet-head h3{font-size:16px;font-weight:700;font-family:"Source Serif 4","Noto Serif SC",Georgia,serif}
  .sheet-head .close{margin-left:auto;width:34px;height:34px;border:none;background:transparent;color:var(--ink);cursor:pointer;border-radius:9px;display:grid;place-items:center}
  .sheet-head .close:hover{background:rgba(120,105,80,.12)}
  .filters{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .filters button{
    border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:12px;
    padding:6px 12px;border-radius:99px;cursor:pointer;font-family:inherit;transition:all .12s ease;
  }
  .filters button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .list{overflow-y:auto;padding:6px 12px 20px}
  .wrow{
    display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:11px;cursor:pointer;border:1px solid transparent;
  }
  .wrow:hover{background:rgba(120,105,80,.07)}
  .wrow .wdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--pending)}
  .wrow.known .wdot{background:var(--known)}
  .wrow.star .wdot{background:var(--star)}
  .wrow .wword{font-family:"Source Serif 4","Noto Serif SC",Georgia,serif;font-size:17px;font-weight:600;min-width:120px}
  .wrow .wzh{font-size:13px;color:var(--ink-soft);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrow .wst{font-size:11px;color:var(--ink-soft)}

  /* ===== 词书切换 & 导入 ===== */
  .books-body{padding:14px 18px 20px;overflow-y:auto}
  .book-list{display:flex;flex-direction:column;gap:6px}
  .book-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;
    border:1px solid var(--line);background:var(--card);cursor:pointer;transition:all .12s ease;
  }
  .book-item:hover{border-color:var(--accent);background:#FFFDF6}
  .book-item.active{border-color:var(--accent);background:rgba(52,91,140,.08)}
  .book-item .bk-name{font-size:13.5px;font-weight:600;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .book-item .bk-count{font-size:11px;color:var(--ink-soft);flex:none}
  .book-item .bk-cur{font-size:10.5px;color:var(--accent);font-weight:600;flex:none}
  .books-divider{height:1px;background:var(--line);margin:14px 0}
  .imp-body{padding:16px 18px 22px;overflow-y:auto}
  .imp-hint{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 14px}
  .file-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    border:1.5px dashed var(--line);border-radius:14px;padding:16px;cursor:pointer;
    color:var(--accent);font-size:13.5px;font-weight:600;background:rgba(255,255,255,.5);transition:all .12s ease;
  }
  .file-btn:hover{border-color:var(--accent);background:rgba(255,255,255,.85)}
  .imp-result{margin-top:14px}
  .imp-err{color:#B3261E;font-size:12.5px;line-height:1.6;margin:4px 0 0}
  .imp-ok{color:var(--ink-soft);font-size:12.5px;line-height:1.6;margin:8px 0 0}
  .imp-ok b{color:var(--ink)}
  .imp-field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-soft)}
  .imp-name{
    border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
    padding:9px 11px;font-family:inherit;font-size:14px;width:100%;box-sizing:border-box;
  }
  .imp-go{
    margin-top:12px;width:100%;border:none;background:var(--accent);color:#fff;
    padding:12px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .imp-go:hover{background:#2E5079}

  button{outline:none}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  @media (max-width:400px){
    .card{padding:28px 18px 24px;min-height:320px}
    .word{font-size:clamp(34px,13vw,46px)}
    .def{font-size:18px}
    .controls{gap:6px}
    .ctrl{min-height:56px;font-size:11px}
    .ctrl .key{display:none}
    .ctrl svg{width:19px;height:19px}
    .stage{min-height:300px}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1 id="appTitle">Ogden 850 · 基础英语词卡</h1>
      <span class="sub" id="subTitle">850 词 · 乱序刷词 · 自动朗读 · 进度自动保存</span>
    </div>
    <div class="head-actions">
      <button class="icon-btn" id="btnBooks" title="词书管理（切换 / 导入）" aria-label="词书管理">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </button>
      <button class="icon-btn" id="btnAuto" title="自动朗读" aria-label="自动朗读开关">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
      <button class="icon-btn" id="btnList" title="查看词表" aria-label="查看词表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <button class="icon-btn" id="btnShuffle" title="重新洗牌" aria-label="重新洗牌">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      </button>
      <button class="icon-btn" id="btnReset" title="重置进度" aria-label="重置进度">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
      </button>
    </div>
  </header>

  <div class="stats">
    <span class="stat"><span class="dot pending"></span>待刷 <b id="cPending">0</b></span>
    <span class="stat"><span class="dot known"></span>标熟 <b id="cKnown">0</b></span>
    <span class="stat"><span class="dot star"></span>标星 <b id="cStar">0</b></span>
    <span class="stat" style="margin-left:auto">第 <b id="cPos">0</b> / <b id="cTotal">0</b> 张</span>
  </div>
  <div class="bar"><i id="progBar"></i></div>

  <div class="stage">
    <div class="deck" id="deck">
      <div class="card hidden" id="card">
        <div class="tab" id="tab"></div>
        <button class="speaker" id="btnSpeak" aria-label="朗读发音">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
        <div class="word" id="word"></div>
        <div class="phonetic" id="phonetic"></div>
        <div class="reveal" id="reveal" style="display:none">
          <div class="def" id="def"></div>
          <div class="ex" id="ex"></div>
        </div>
        <div class="hint-reveal" id="hintReveal">按 <kbd>空格</kbd> 查看释义</div>
      </div>
      <div class="done" id="done">
        <h2>本轮刷完</h2>
        <p id="doneMsg"></p>
        <div class="d-stats">
          <span class="stat"><span class="dot known"></span><b id="doneKnown">0</b>已熟</span>
          <span class="stat"><span class="dot star"></span><b id="doneStar">0</b>标星</span>
          <span class="stat"><span class="dot pending"></span><b id="donePending">0</b>待刷</span>
        </div>
        <div class="d-actions">
          <button class="ctrl" id="btnContinue" style="min-height:52px;flex-direction:row;gap:8px;color:var(--accent);border-color:#B9CBDE">继续刷剩余待刷词</button>
          <button class="ctrl" id="btnReviewStar" style="min-height:52px;flex-direction:row;gap:8px;color:var(--star);border-color:#E0C69B">重点复习标星词</button>
          <button class="ctrl" id="btnResetAll" style="min-height:52px;flex-direction:row;gap:8px">全部重置，从头再刷</button>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl prev" id="btnPrev">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      <span>上一个 <span class="key">←</span></span>
    </button>
    <button class="ctrl known-btn" id="btnKnown">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <span>标熟 <span class="key">↑</span></span>
    </button>
    <button class="ctrl reveal-btn" id="btnReveal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      <span>查看释义 <span class="key">空格</span></span>
    </button>
    <button class="ctrl star-btn" id="btnStar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 18.2 6.2 21l1.1-6.5L2.6 9.8l6.5-.9L12 3z"/></svg>
      <span>标星 <span class="key">↓</span></span>
    </button>
    <button class="ctrl next" id="btnNext">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      <span>下一个 <span class="key">→</span></span>
    </button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="sheet">
    <div class="sheet-head">
      <h3>词表</h3>
      <button class="close" id="btnCloseList" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="filters" id="filters">
      <button data-f="all" class="active">全部</button>
      <button data-f="pending">待刷</button>
      <button data-f="known">标熟</button>
      <button data-f="star">标星</button>
    </div>
    <div class="list" id="wordList"></div>
  </div>
</div>

<div class="mask" id="maskBooks">
  <div class="sheet">
    <div class="sheet-head">
      <h3>词书管理</h3>
      <button class="close" id="btnCloseBooks" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="books-body">
      <div class="book-list" id="bookList"></div>
      <div class="books-divider"></div>
      <p class="imp-hint">导入新词书（支持 JSON / TXT / CSV），进度独立保存。</p>
      <label class="file-btn" id="filePick">选择文件<input type="file" id="impFile" accept=".json,.txt,.csv" hidden></label>
      <div class="imp-result" id="impResult"></div>
    </div>
  </div>
</div>

<script>

/* ===== 状态 ===== */
const KEY_PREFIX = "ogden850_state_";

let WORDS = BUILTIN_WORDS;
let BOOKS = [];
let bookId = "ogden850";
let state = { status:{}, deck:[], ptr:0, filter:"all", curFilter:"all" };

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function freshState(){
  const status = {};
  for(let i=0;i<WORDS.length;i++) status[i]="pending";
  return { status, deck:shuffled(WORDS.map((_,i)=>i)), ptr:0, filter:"all", curFilter:"all", autoSpeak:true };
}
function load(){
  try{
    const raw = localStorage.getItem(KEY_PREFIX+bookId);
    if(raw){
      const s = JSON.parse(raw);
      // 兼容词库变化：为新词补默认状态
      for(let i=0;i<WORDS.length;i++) if(!(i in s.status)) s.status[i]="pending";
      if(!Array.isArray(s.deck) || s.deck.length===0) s.deck = shuffled(WORDS.map((_,i)=>i));
      if(s.ptr==null) s.ptr=0;
      if(s.autoSpeak==null) s.autoSpeak=true;
      return s;
    }
  }catch(e){}
  return freshState();
}
function save(){
  try{ localStorage.setItem(KEY_PREFIX+bookId, JSON.stringify(state)); }catch(e){}
}

/* ===== 词书管理 & 导入 ===== */
function saveBooks(){
  try{ localStorage.setItem(BOOKS_KEY, JSON.stringify({list:BOOKS, current:bookId})); }catch(e){}
}
function renderBooks(){
  const box = $("bookList");
  box.innerHTML = "";
  for(const b of BOOKS){
    const row = document.createElement("div");
    row.className = "book-item" + (b.id===bookId ? " active" : "");
    row.dataset.id = b.id;
    row.innerHTML = '<span class="bk-name">'+escAttr(b.name)+'</span>'
      + '<span class="bk-count">'+b.count+' 词</span>'
      + (b.id===bookId ? '<span class="bk-cur">当前</span>' : '');
    box.appendChild(row);
  }
  const cur = BOOKS.find(b=>b.id===bookId);
  if(cur){
    $("appTitle").textContent = cur.name;
    $("subTitle").textContent = cur.count + " 词 · 乱序刷词 · 自动朗读 · 进度独立保存";
  }
}
function activateBook(id){
  bookId = id;
  const b = BOOKS.find(x=>x.id===id);
  if(b && b.builtin) WORDS = BUILTIN_WORDS;
  else if(b){
    try{ WORDS = JSON.parse(localStorage.getItem(DATA_KEY_PREFIX+id)) || []; }
    catch(e){ WORDS = []; }
  }
  state = load();
  revealed = false;
  saveBooks();
  renderBooks();
}
function switchBook(id){ activateBook(id); render(); }
function initBooks(){
  let reg = null;
  try{ reg = JSON.parse(localStorage.getItem(BOOKS_KEY)); }catch(e){}
  if(reg && Array.isArray(reg.list) && reg.list.length){
    BOOKS = reg.list;
    bookId = reg.current || BOOKS[0].id;
  } else {
    const old = localStorage.getItem("ogden850_state_v1");
    if(old) localStorage.setItem(KEY_PREFIX+"ogden850", old);
    BOOKS = [{id:"ogden850", name:"Ogden 850 基础英语词卡", builtin:true, count:BUILTIN_WORDS.length}];
    bookId = "ogden850";
    saveBooks();
  }
  activateBook(bookId);
}
function genId(){ return "b"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function parseBookText(text){
  const t = String(text||"").trim();
  if(!t) return {error:"文件是空的"};
  let items = [];
  if(t[0]==="[" || t[0]==="{"){
    let data;
    try{ data = JSON.parse(t); }catch(e){ return {error:"JSON 解析失败："+e.message}; }
    const arr = Array.isArray(data) ? data : (data && (data.words||data.list||data.items));
    if(!Array.isArray(arr)) return {error:"JSON 无法识别：应为数组，或含 words 数组的对象"};
    for(const o of arr){
      if(!o || typeof o!=="object") continue;
      const word = String(o.word ?? o.w ?? o.单词 ?? "").trim();
      if(!word) continue;
      items.push({
        word: word,
        ph: String(o.ph ?? o.phonetic ?? o.音标 ?? "").trim(),
        zh: String(o.zh ?? o.meaning ?? o.释义 ?? "").trim(),
        ex: String(o.ex ?? o.example ?? o.例句 ?? "").trim()
      });
    }
  } else {
    const lines = t.split(/\r?\n/);
    for(const raw of lines){
      const line = raw.trim();
      if(!line || line.startsWith("#")) continue;
      const sep = line.includes("|") ? "|" : line.includes("\t") ? "\t" : null;
      if(sep){
        const p = line.split(sep).map(x=>x.trim());
        if(!p[0]) continue;
        items.push({word:p[0], ph:p[1]||"", zh:p[2]||"", ex:p.slice(3).join(" ").trim()});
      } else {
        const m = line.match(/^(\S+)\s*(?:\/([^/]*)\/)?\s*(.*)$/);
        if(!m || !m[1]) continue;
        let zh = (m[3]||"").trim(), ex = "";
        const z = zh.match(/^(.+?)\s+([A-Z][^.!?]*[.!?].*)$/);
        if(z){ zh = z[1].trim(); ex = z[2].trim(); }
        items.push({word:m[1], ph:(m[2]||"").trim(), zh:zh, ex:ex});
      }
    }
  }
  const seen = new Set(), out = [];
  for(const it of items){
    const w = String(it.word).trim();
    if(!w || seen.has(w.toLowerCase())) continue;
    seen.add(w.toLowerCase());
    out.push(it);
  }
  return {words:out, total:items.length, skipped:items.length-out.length};
}
function showToast(msg){
  let el = $("toast");
  if(!el){
    el = document.createElement("div");
    el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1A1B1C;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:40;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .2s ease;max-width:80%;text-align:center;";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = "1";
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function(){ el.style.opacity = "0"; }, 2600);
}
function openBooks(){
  renderBooks();
  $("maskBooks").classList.add("open");
  $("impResult").innerHTML = "";
  $("impFile").value = "";
}
function closeBooks(){ $("maskBooks").classList.remove("open"); }
function escAttr(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function onFilePicked(e){
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = function(){
    const res = parseBookText(reader.result);
    const box = $("impResult");
    if(res.error){ box.innerHTML = '<p class="imp-err">'+res.error+'</p>'; return; }
    if(!res.words.length){ box.innerHTML = '<p class="imp-err">没有识别到任何单词，请检查文件格式。</p>'; return; }
    const stem = f.name.replace(/\.[^.]+$/,"") || "新词书";
    box.innerHTML = ''
      + '<label class="imp-field">书名<input class="imp-name" id="impName" value="'+escAttr(stem)+'" maxlength="30"></label>'
      + '<p class="imp-ok">识别到 <b>'+res.words.length+'</b> 个单词'
      + (res.skipped ? '（跳过 '+res.skipped+' 个无效/重复）' : '') + '</p>'
      + '<button class="imp-go" id="btnDoImport">导入并开始刷</button>';
    $("btnDoImport").addEventListener("click", function(){
      const name = ($("impName").value||"").trim() || stem;
      const id = genId();
      const book = {id:id, name:name, builtin:false, count:res.words.length};
      try{ localStorage.setItem(DATA_KEY_PREFIX+id, JSON.stringify(res.words)); }
      catch(err){ alert("保存失败：词书过大或存储已满。"); return; }
      BOOKS.push(book);
      bookId = id;
      WORDS = res.words;
      state = freshState();
      revealed = false;
      saveBooks();
      closeBooks();
      renderBooks();
      render();
      showToast("已导入《"+name+"》"+res.words.length+" 词");
    });
  };
  reader.onerror = function(){ $("impResult").innerHTML = '<p class="imp-err">读取文件失败。</p>'; };
  reader.readAsText(f, "utf-8");
}
function counts(){
  const c={pending:0,known:0,star:0};
  for(const k in state.status){
    const s = state.status[k];
    if(s==="known") c.known++;
    else if(s==="star") c.star++;
    else c.pending++;
  }
  return c;
}

/* ===== 渲染 ===== */
const $ = id => document.getElementById(id);
const elCard=$("card"), elWord=$("word"), elPh=$("phonetic"), elDef=$("def"), elEx=$("ex"),
      elReveal=$("reveal"), elTab=$("tab"), elHint=$("hintReveal"),
      elDone=$("done"), elDeck=$("deck");

let revealed = false;
let ttsVoiceReady = ("speechSynthesis" in window);

function tabContent(){
  const s = state.status[state.deck[state.ptr]];
  if(s==="known") return {cls:"known", label:"已标熟"};
  if(s==="star") return {cls:"star", label:"已标星"};
  return {cls:"hidden", label:""};
}
function render(){
  const c = counts();
  $("cPending").textContent = c.pending;
  $("cKnown").textContent = c.known;
  $("cStar").textContent = c.star;
  const total = state.deck.length || 1;
  $("cTotal").textContent = WORDS.length;
  $("cPos").textContent = Math.min(state.ptr+1, state.deck.length);
  $("progBar").style.width = Math.round(state.ptr/total*100)+"%";

  const finished = state.ptr >= state.deck.length || state.deck.length===0;
  elDeck.style.display = finished ? "block" : "block";
  elCard.style.display = finished ? "none" : "flex";
  elDone.style.display = finished ? "block" : "none";
  $("btnPrev").disabled = finished || state.ptr<=0;
  $("btnNext").disabled = finished;
  $("btnKnown").disabled = finished;
  $("btnStar").disabled = finished;

  if(finished){
    $("doneKnown").textContent = c.known;
    $("doneStar").textContent = c.star;
    $("donePending").textContent = c.pending;
    $("doneMsg").textContent = c.pending>0
      ? "本轮你把刷过的词处理完了，剩余待刷词可以重新洗牌继续。"
      : "太棒了，这本词书已经全部处理完！";
    return;
  }

  const idx = state.deck[state.ptr];
  const w = WORDS[idx];
  elWord.textContent = w.word;
  elPh.textContent = "/" + w.ph + "/";
  elDef.textContent = w.zh;
  elEx.textContent = w.ex;

  const t = tabContent();
  elCard.className = "card " + t.cls;
  elTab.innerHTML = (t.label ? t.label : "");
  if(!ttsVoiceReady) $("btnSpeak").style.display = "none";
  renderReveal();
  renderAutoBtn();
  speakWord();
}
function renderReveal(){
  const s = state.status[state.deck[state.ptr]];
  const isKnown = s==="known", isStar = s==="star";
  elReveal.style.display = revealed ? "block" : "none";
  elHint.style.display = revealed ? "none" : "block";
  $("btnKnown").innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span>'+(isKnown?"取消标熟":"标熟")+' <span class="key">↑</span></span>';
  $("btnStar").innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 18.2 6.2 21l1.1-6.5L2.6 9.8l6.5-.9L12 3z"/></svg><span>'+(isStar?"取消标星":"标星")+' <span class="key">↓</span></span>';
  $("btnReveal").innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><span>'+(revealed?"收起释义":"查看释义")+' <span class="key">空格</span></span>';
}

/* ===== 动作 ===== */
function goNext(){ revealed=false; if(state.ptr < state.deck.length) state.ptr++; save(); render(); }
function goPrev(){ revealed=false; if(state.ptr>0) state.ptr--; save(); render(); }
function markKnown(){
  const idx = state.deck[state.ptr];
  const s = state.status[idx];
  if(s==="known"){ state.status[idx]="pending"; } // 取消标熟
  else{ state.status[idx]="known"; if(state.ptr < state.deck.length) state.ptr++; }
  revealed=false; save(); render();
}
function markStar(){
  const idx = state.deck[state.ptr];
  const s = state.status[idx];
  if(s==="star"){ state.status[idx]="pending"; } // 取消标星
  else{ state.status[idx]="star"; if(state.ptr < state.deck.length) state.ptr++; }
  revealed=false; save(); render();
}
function toggleReveal(){
  if(state.ptr < state.deck.length){
    revealed=!revealed;
    if(revealed && state.autoSpeak) speakText(WORDS[state.deck[state.ptr]].ex, "en-US");
    renderReveal();
  }
}
/* ===== 朗读（浏览器 TTS）===== */
let ttsVoices = [];
let lastSpoken = -1;
function loadVoices(){ try{ ttsVoices = speechSynthesis.getVoices() || []; }catch(e){ ttsVoices = []; } }
if(ttsVoiceReady){
  loadVoices();
  if("onvoiceschanged" in speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(lang){
  const list = ttsVoices.length ? ttsVoices : (speechSynthesis.getVoices() || []);
  return list.find(v => v.lang && v.lang.replace("_","-").toLowerCase().startsWith(lang.toLowerCase()))
      || list.find(v => v.lang && /^en/i.test(v.lang)) || null;
}
function speakText(text, lang){
  if(!ttsVoiceReady || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || "en-US";
  u.rate = 0.82;
  const v = pickVoice(u.lang);
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}
function speakWord(){
  if(!state.autoSpeak) return;
  const idx = state.deck[state.ptr];
  if(idx==null || idx===lastSpoken) return;
  lastSpoken = idx;
  speakText(WORDS[idx].word, "en-US");
}
function renderAutoBtn(){
  const on = !!state.autoSpeak;
  const b = $("btnAuto");
  b.classList.toggle("on", on);
  b.title = on ? "自动朗读：开（点按关闭）" : "自动朗读：关（点按开启）";
  b.setAttribute("aria-label", on ? "关闭自动朗读" : "开启自动朗读");
}
function speak(){
  const idx = state.deck[state.ptr];
  if(idx==null) return;
  lastSpoken = idx;
  speakText(WORDS[idx].word, "en-US");
}
function reshuffle(){
  const pending = [];
  for(let i=0;i<WORDS.length;i++) if(state.status[i]==="pending") pending.push(i);
  state.deck = shuffled(pending);
  state.ptr = 0; revealed=false; save(); render();
}
function reviewStar(){
  const starred = [];
  for(let i=0;i<WORDS.length;i++) if(state.status[i]==="star") starred.push(i);
  state.deck = shuffled(starred.length? starred : WORDS.map((_,i)=>i));
  state.ptr = 0; revealed=false; save(); render();
}
function resetAll(){
  if(!confirm("确定要重置全部进度吗？所有标记将清空。")) return;
  state = freshState(); save(); render();
}

/* ===== 词表弹层 ===== */
function renderList(){
  const box = $("wordList");
  const f = state.curFilter;
  const order = [];
  for(let i=0;i<WORDS.length;i++) order.push(i);
  order.sort((a,b)=> WORDS[a].word.localeCompare(WORDS[b].word));
  let html = "";
  for(const i of order){
    const s = state.status[i];
    if(f==="pending" && s!=="pending") continue;
    if(f==="known" && s!=="known") continue;
    if(f==="star" && s!=="star") continue;
    const st = s==="known" ? "已熟" : s==="star" ? "标星" : "待刷";
    const cls = s==="known" ? "known" : s==="star" ? "star" : "";
    html += '<div class="wrow '+cls+'" data-i="'+i+'"><span class="wdot"></span><span class="wword">'+WORDS[i].word+'</span><span class="wzh">'+WORDS[i].zh+'</span><span class="wst">'+st+'</span></div>';
  }
  box.innerHTML = html || '<div style="text-align:center;color:var(--ink-soft);padding:30px 0">这里还没有单词</div>';
}
function openList(){
  state.curFilter = state.curFilter||"all";
  $("mask").classList.add("open");
  document.querySelectorAll("#filters button").forEach(b=>b.classList.toggle("active", b.dataset.f===state.curFilter));
  renderList();
}
function closeList(){ $("mask").classList.remove("open"); }

/* ===== 事件绑定 ===== */
$("btnNext").addEventListener("click", goNext);
$("btnPrev").addEventListener("click", goPrev);
$("btnKnown").addEventListener("click", markKnown);
$("btnStar").addEventListener("click", markStar);
$("btnReveal").addEventListener("click", toggleReveal);
$("btnSpeak").addEventListener("click", speak);
$("btnAuto").addEventListener("click", ()=>{
  state.autoSpeak = !state.autoSpeak;
  save(); renderAutoBtn();
  if(!state.autoSpeak){ if(ttsVoiceReady) speechSynthesis.cancel(); }
  else if(state.ptr < state.deck.length){ lastSpoken = -1; speakWord(); }
});
$("btnShuffle").addEventListener("click", ()=>{ if(state.ptr < state.deck.length){ reshuffle(); } });
$("btnReset").addEventListener("click", resetAll);
$("btnList").addEventListener("click", openList);
$("btnCloseList").addEventListener("click", closeList);
$("mask").addEventListener("click", e=>{ if(e.target=== $("mask")) closeList(); });
$("maskBooks").addEventListener("click", e=>{ if(e.target===$("maskBooks")) closeBooks(); });
$("btnBooks").addEventListener("click", openBooks);
$("btnCloseBooks").addEventListener("click", closeBooks);
$("impFile").addEventListener("change", onFilePicked);
$("bookList").addEventListener("click", e=>{
  const row = e.target.closest(".book-item"); if(!row) return;
  if(row.dataset.id===bookId){ closeBooks(); return; }
  switchBook(row.dataset.id);
  closeBooks();
});
$("btnContinue").addEventListener("click", ()=>{ reshuffle(); });
$("btnReviewStar").addEventListener("click", ()=>{ reviewStar(); });
$("btnResetAll").addEventListener("click", ()=>{ resetAll(); });

$("filters").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  state.curFilter = b.dataset.f;
  document.querySelectorAll("#filters button").forEach(x=>x.classList.toggle("active", x===b));
  renderList();
});
$("wordList").addEventListener("click", e=>{
  const row = e.target.closest(".wrow"); if(!row) return;
  const i = +row.dataset.i;
  // 跳到该词，后面接其余待刷词
  const rest = [];
  for(let k=0;k<WORDS.length;k++) if(state.status[k]==="pending" && k!==i) rest.push(k);
  state.deck = [i, ...shuffled(rest)];
  state.ptr = 0; revealed=false; save();
  closeList(); render();
});

document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA") return;
  if($("mask").classList.contains("open") || $("maskBooks").classList.contains("open")){
    if(e.key==="Escape"){ if($("mask").classList.contains("open")) closeList(); else closeBooks(); }
    return;
  }
  if(e.key==="ArrowLeft"){ e.preventDefault(); goPrev(); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); goNext(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); markKnown(); }
  else if(e.key==="ArrowDown"){ e.preventDefault(); markStar(); }
  else if(e.key===" " || e.code==="Space"){ e.preventDefault(); toggleReveal(); }
  else if(e.key==="l" || e.key==="L"){ openList(); }
});

/* ===== 启动 ===== */
initBooks();
render();
</script>
</body>
</html>
